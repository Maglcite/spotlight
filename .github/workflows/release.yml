name: Linux release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libxkbcommon-dev libwayland-dev libudev-dev libfontconfig1-dev cmake
      - name: Build release binary
        run: cargo build --release --locked
      - name: Assemble archive
        run: |
          mkdir -p dist/spotlight-linux-x86_64/target/release dist/spotlight-linux-x86_64/scripts dist/spotlight-linux-x86_64/assets
          install -m755 target/release/spotlight dist/spotlight-linux-x86_64/target/release/spotlight
          install -m755 scripts/install.sh scripts/cosmic-shortcut.py dist/spotlight-linux-x86_64/scripts/
          install -m644 assets/io.github.Maglcite.Spotlight.svg dist/spotlight-linux-x86_64/assets/
          install -m644 LICENSE README.md dist/spotlight-linux-x86_64/
          tar -czf spotlight-linux-x86_64.tar.gz -C dist spotlight-linux-x86_64
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotlight-linux-x86_64
          path: spotlight-linux-x86_64.tar.gz
      - name: Publish tagged release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" spotlight-linux-x86_64.tar.gz --generate-notes
